name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android_app/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          cd android_app
          # Install gradle if gradlew is missing
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK for website
        run: |
          mkdir -p frontend
          cp android_app/app/build/outputs/apk/debug/app-debug.apk frontend/turf-cricket-scorer.apk

      - name: Commit and Push APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/turf-cricket-scorer.apk
          git commit -m "chore: update android apk [skip ci]" || echo "No changes to commit"
          git push
